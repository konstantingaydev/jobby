{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-1">Applicant Map</h2>
            <h5 class="text-muted">{{ job.title }}</h5>
        </div>
        <div>
            <a href="{% url 'jobs.show' job.id %}" class="btn btn-outline-primary me-2">View Job Details</a>
            <a href="{% url 'recruiter:dashboard' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div id="map" style="height: 600px; width: 100%; border-radius: 0.375rem;"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var map = L.map('map').setView([37.0902, -95.7129], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var markers = L.markerClusterGroup();

    // DYNAMIC URL: Uses the specific job ID
    fetch("{% url 'recruiter:job_applicant_map_data' job.id %}")
        .then(response => response.json())
        .then(data => {
            if (!data.applicants || data.applicants.length === 0) {
                // Optional: Show a message if no applicants have locations
                return;
            }

            data.applicants.forEach(function(c) {
                var marker = L.marker([c.lat, c.lng]);
                
                var popupContent = `
                    <div class="text-center">
                        <strong>${c.name}</strong><br>
                        <span class="text-muted small">${c.headline || 'No headline'}</span><br>
                        <span class="badge bg-info text-dark mt-1">Applied: ${c.applied_at}</span><br>
                        <a href="${c.url}" class="btn btn-sm btn-primary mt-2">View Profile</a>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers.addLayer(marker);
            });
            
            map.addLayer(markers);
            
            if (data.applicants.length > 0) {
                map.fitBounds(markers.getBounds(), {padding: [50, 50]});
            }
        })
        .catch(error => console.error('Error loading map data:', error));
});
</script>
{% endblock %}
